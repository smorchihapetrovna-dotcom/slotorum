<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Слоторум</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070712;
    --surface: #140c22;
    --fg: #ece8ff;
    --muted: #9b92b8;
    --primary: #ff66cc;
    --primary2: #c41a7a;
    --gold: #ffcc00;
    --mint: #66ffcc;
    --archive: #3d9b78;
    --archive2: #1e4a3a;
    --border: rgba(255, 102, 204, 0.28);
    --border-a: rgba(61, 155, 120, 0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: Manrope, system-ui, sans-serif;
    overflow: hidden;
  }
  button, [role="button"] { cursor: pointer; font-family: inherit; }
  .viewport { height: 100dvh; width: 100%; overflow: hidden; position: relative; }
  .track {
    display: flex;
    height: 100%;
    width: 300%;
    transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }
  .panel { width: 33.3333%; height: 100%; position: relative; flex-shrink: 0; overflow: hidden; }

  /* Hub */
  .hub {
    display: flex;
    height: 100%;
    width: 100%;
    position: relative;
    background: var(--bg);
  }
  .hub-side {
    flex: 1 1 50%;
    position: relative;
    overflow: hidden;
    border: 0;
    background: transparent;
    color: var(--fg);
    padding: 0;
    min-width: 0;
  }
  .hub-side .bg-grad {
    position: absolute;
    inset: 0;
    transition: opacity 0.4s ease, filter 0.4s ease;
  }
  /* Soft outer glow only — fully transparent toward the center */
  .hub-side.left .bg-grad {
    background:
      radial-gradient(ellipse 90% 100% at 0% 50%, rgba(255,102,204,0.38) 0%, rgba(196,26,122,0.16) 38%, rgba(196,26,122,0.04) 62%, transparent 78%),
      radial-gradient(ellipse 55% 70% at 15% 70%, rgba(255,102,204,0.12) 0%, transparent 70%);
  }
  .hub-side.right .bg-grad {
    background:
      radial-gradient(ellipse 90% 100% at 100% 50%, rgba(61,155,120,0.4) 0%, rgba(30,74,58,0.18) 38%, rgba(30,74,58,0.04) 62%, transparent 78%),
      radial-gradient(ellipse 55% 70% at 85% 70%, rgba(61,155,120,0.12) 0%, transparent 70%);
  }
  .hub-side.left:hover .bg-grad,
  .hub-side.left:focus-visible .bg-grad {
    filter: brightness(1.25) saturate(1.2);
    background:
      radial-gradient(ellipse 95% 105% at 0% 50%, rgba(255,102,204,0.55) 0%, rgba(255,102,204,0.28) 36%, rgba(196,26,122,0.08) 60%, transparent 76%),
      radial-gradient(ellipse 60% 75% at 18% 68%, rgba(255,102,204,0.22) 0%, transparent 70%);
  }
  .hub-side.right:hover .bg-grad,
  .hub-side.right:focus-visible .bg-grad {
    filter: brightness(1.25) saturate(1.2);
    background:
      radial-gradient(ellipse 95% 105% at 100% 50%, rgba(61,155,120,0.55) 0%, rgba(61,155,120,0.28) 36%, rgba(30,74,58,0.08) 60%, transparent 76%),
      radial-gradient(ellipse 60% 75% at 82% 68%, rgba(61,155,120,0.22) 0%, transparent 70%);
  }
  /* Character silhouettes inside the glow */
  .hub-figure {
    position: absolute;
    bottom: 0;
    height: 70vh;
    max-height: 70vh;
    width: auto;
    max-width: none;
    object-fit: contain;
    object-position: bottom center;
    pointer-events: none;
    z-index: 2;
    opacity: 0.06;
    transition: opacity 0.45s ease, filter 0.45s ease;
    filter: drop-shadow(0 0 20px rgba(255,102,204,0.25));
  }
  .hub-side.left .hub-figure {
    left: 0;
    transform: none;
  }
  .hub-side.right .hub-figure {
    right: 0;
    left: auto;
    transform: none;
    filter: drop-shadow(0 0 20px rgba(61,155,120,0.25));
  }
  .hub-side.left:hover .hub-figure,
  .hub-side.left:focus-visible .hub-figure {
    opacity: 0.22;
    filter: drop-shadow(0 0 32px rgba(255,102,204,0.45));
  }
  .hub-side.right:hover .hub-figure,
  .hub-side.right:focus-visible .hub-figure {
    opacity: 0.22;
    filter: drop-shadow(0 0 32px rgba(61,155,120,0.45));
  }
  .hub-label {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
    padding: 1.5rem;
  }
  .hub-label h2 {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(0.85rem, 2.4vw, 1.4rem);
    line-height: 1.55;
    text-shadow: 0 0 18px currentColor, 0 2px 12px rgba(0,0,0,0.65);
  }
  .hub-side.left .hub-label h2 { color: var(--primary); }
  .hub-side.right .hub-label h2 { color: var(--archive); }

  /* Continuous side glow so hub transition has no hard edge */
  .panel-glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .panel.stream .panel-glow {
    background:
      radial-gradient(ellipse 70% 100% at 100% 50%, rgba(255,102,204,0.34) 0%, rgba(196,26,122,0.14) 40%, transparent 72%),
      radial-gradient(ellipse 45% 70% at 85% 70%, rgba(255,102,204,0.1) 0%, transparent 70%);
  }
  .panel.archive .panel-glow {
    background:
      radial-gradient(ellipse 70% 100% at 0% 50%, rgba(61,155,120,0.36) 0%, rgba(30,74,58,0.16) 40%, transparent 72%),
      radial-gradient(ellipse 45% 70% at 15% 70%, rgba(61,155,120,0.1) 0%, transparent 70%);
  }

  .bg-layer {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .float-img {
    position: absolute;
    border-radius: 14px;
    object-fit: cover;
    opacity: 0.3;
    border: 2px solid rgba(255,102,204,0.35);
    box-shadow: 0 0 40px rgba(255,102,204,0.35);
    animation-name: fly;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    will-change: transform;
  }
  .float-img.archive {
    border-color: rgba(61,155,120,0.4);
    box-shadow: 0 0 40px rgba(61,155,120,0.35);
  }
  @keyframes fly {
    0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
    20%  { transform: translate(var(--x1), var(--y1)) rotate(var(--r1)) scale(1.08); }
    40%  { transform: translate(var(--x2), var(--y2)) rotate(var(--r2)) scale(0.94); }
    60%  { transform: translate(var(--x3), var(--y3)) rotate(var(--r3)) scale(1.1); }
    80%  { transform: translate(var(--x4), var(--y4)) rotate(var(--r4)) scale(0.97); }
    100% { transform: translate(0, 0) rotate(0deg) scale(1); }
  }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 1rem 1rem 1.25rem;
  }
  .content-inner {
    max-width: 56rem;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    flex: 1;
  }
  .panel-head {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.85rem;
  }
  .panel-head h1 {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(0.7rem, 2vw, 1rem);
    line-height: 1.5;
  }
  .panel.stream .panel-head h1 { color: var(--primary); text-shadow: 0 0 12px var(--primary); }
  .panel.archive .panel-head h1 { color: var(--archive); text-shadow: 0 0 12px var(--archive); }

  .search-wrap { position: relative; margin-bottom: 0.85rem; }
  .search-wrap input {
    width: 100%;
    height: 3rem;
    border-radius: 0.85rem;
    border: 1px solid var(--border);
    background: rgba(20,12,34,0.92);
    color: var(--fg);
    padding: 0 1rem 0 2.75rem;
    font-size: 1rem;
    outline: none;
  }
  .panel.archive .search-wrap input { border-color: var(--border-a); }
  .search-wrap input:focus { border-color: var(--primary); }
  .panel.archive .search-wrap input:focus { border-color: var(--archive); }
  .search-wrap svg {
    position: absolute;
    left: 0.9rem;
    top: 50%;
    transform: translateY(-50%);
    width: 1.1rem;
    height: 1.1rem;
    color: var(--muted);
    pointer-events: none;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.85rem; }
  .chip {
    height: 2.1rem;
    padding: 0 0.75rem;
    border-radius: 999px;
    border: 1px solid var(--border-a);
    background: rgba(20,12,34,0.75);
    color: var(--fg);
    font-size: 0.85rem;
    font-weight: 600;
  }
  .chip.active { background: var(--archive); color: var(--bg); border-color: transparent; }
  .sort-bar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.85rem; align-items: center; }
  .sort-bar .label { color: var(--muted); font-size: 0.85rem; margin-right: 0.25rem; }
  .sort-btn {
    height: 2.1rem; padding: 0 0.85rem; border-radius: 999px;
    border: 1px solid var(--border-a); background: rgba(20,12,34,0.75);
    color: var(--fg); font-size: 0.85rem; font-weight: 600;
  }
  .sort-btn.active { background: var(--archive); color: var(--bg); border-color: transparent; }

  .table-wrap, .archive-list {
    flex: 1;
    min-height: 0;
    overflow: auto;
    border-radius: 1rem;
    border: 1px solid var(--border);
    background: rgba(20,12,34,0.92);
  }
  .panel.archive .archive-list { border: none; background: transparent; }
  table { width: 100%; border-collapse: collapse; }
  thead { position: sticky; top: 0; z-index: 1; }
  th {
    background: linear-gradient(90deg, var(--primary2), var(--primary));
    color: #fff;
    font-family: "Press Start 2P", monospace;
    font-size: 0.62rem;
    padding: 0.85rem 1rem;
    text-align: left;
  }
  th:nth-child(2), th:nth-child(3) { text-align: center; width: 5.5rem; }
  td { padding: 0.7rem 1rem; border-bottom: 1px solid rgba(255,102,204,0.12); }
  tr:nth-child(even) { background: rgba(255,102,204,0.05); }
  tr:hover { background: rgba(255,102,204,0.14); }
  .game-cell { display: flex; align-items: center; gap: 0.85rem; }
  .rank {
    width: 1.9rem; height: 1.9rem; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: #333; font-size: 0.78rem; font-weight: 700; flex-shrink: 0;
  }
  .rank-1 { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #111; }
  .rank-2 { background: linear-gradient(135deg, #e0e0e0, #a8a8a8); color: #111; }
  .rank-3 { background: linear-gradient(135deg, #cd7f32, #a05a2c); color: #fff; }
  .pts { text-align: center; font-weight: 800; font-size: 1.1rem; color: var(--gold); text-shadow: 0 0 8px #ffaa00; }
  .chance { text-align: center; font-weight: 700; color: var(--mint); }

  .cat-block {
    margin-bottom: 0.85rem;
    border-radius: 1rem;
    border: 1px solid var(--border-a);
    background: rgba(20,12,34,0.92);
    overflow: hidden;
  }
  .cat-block h2 {
    background: var(--archive2);
    color: var(--archive);
    font-family: "Press Start 2P", monospace;
    font-size: 0.68rem;
    padding: 0.7rem 1rem;
  }
  .cat-block h2 span { font-family: Manrope, sans-serif; color: var(--muted); margin-left: 0.4rem; font-size: 0.8rem; }
  .cat-block a, .cat-block .nolink {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.7rem 1rem; color: var(--fg); text-decoration: none;
    border-top: 1px solid rgba(61,155,120,0.2);
  }
  .cat-block a:hover { background: rgba(61,155,120,0.12); color: var(--mint); }

  .foot { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 0.65rem; }

  /* Horizontal back control on the edge */
  .side-zone {
    position: absolute;
    top: 0; bottom: 0;
    width: min(22%, 9rem);
    z-index: 8;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--muted);
    opacity: 0.65;
    transition: opacity 0.25s, background 0.25s, color 0.25s;
  }
  .side-zone:hover, .side-zone:focus-visible {
    opacity: 1;
    color: var(--fg);
  }
  .side-zone.left { left: 0; background: linear-gradient(90deg, rgba(0,0,0,0.28), transparent); }
  .side-zone.right { right: 0; background: linear-gradient(270deg, rgba(0,0,0,0.28), transparent); }
  .side-zone span {
    writing-mode: horizontal-tb;
    transform: none;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .content.has-side-left { padding-left: max(1rem, min(22%, 9rem)); }
  .content.has-side-right { padding-right: max(1rem, min(22%, 9rem)); }

  .chance-help {
    position: absolute;
    bottom: 0.75rem;
    left: 0.75rem;
    z-index: 9;
    max-width: 20rem;
    background: rgba(15,10,30,0.95);
    border: 1px solid var(--border);
    border-radius: 0.85rem;
    font-size: 0.85rem;
  }
  .chance-help summary {
    padding: 0.7rem 0.9rem;
    cursor: pointer;
    font-weight: 700;
    color: var(--primary);
    list-style: none;
  }
  .chance-help summary::-webkit-details-marker { display: none; }
  .chance-help .body { padding: 0 0.9rem 0.9rem; color: var(--muted); line-height: 1.5; }

  @media (max-width: 700px) {
    .side-zone { width: 4.2rem; }
    .side-zone span { font-size: 0.8rem; }
    .content.has-side-left { padding-left: 4.4rem; }
    .content.has-side-right { padding-right: 4.4rem; }
    th { font-size: 0.55rem; padding: 0.65rem 0.55rem; }
    td { padding: 0.55rem 0.55rem; font-size: 0.9rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .track, .float-img { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="viewport" id="viewport">
  <div class="track" id="track">
    <section class="panel stream" id="panel-stream">
      <div class="bg-layer" id="bg-stream"></div>
      <div class="panel-glow" aria-hidden="true"></div>
      <button type="button" class="side-zone right" id="back-from-stream" aria-label="Назад">
        <span>Назад</span>
      </button>
      <div class="content has-side-right">
        <div class="content-inner">
          <div class="panel-head"><h1>Список игр для стрима</h1></div>
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
            <input id="stream-search" type="search" placeholder="Поиск по названию…" aria-label="Поиск">
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Игра</th><th>Баллы</th><th>Шанс</th></tr></thead>
              <tbody id="stream-body"></tbody>
            </table>
          </div>
          <p class="foot" id="stream-foot"></p>
        </div>
      </div>
      <details class="chance-help">
        <summary>Как считается шанс выпадения</summary>
        <div class="body">
          <p>Баллы возводятся в квадрат: вес = баллы × баллы.</p>
          <p style="margin-top:0.5rem">Шанс = вес игры ÷ сумма весов всех игр.</p>
        </div>
      </details>
    </section>

    <section class="panel" id="panel-hub">
      <div class="hub" id="hub">
        <button type="button" class="hub-side left" id="go-stream" aria-label="Список игр на стрим">
          <div class="bg-grad"></div>
          <img class="hub-figure" src="images/slot_holder.png" alt="" decoding="async">
          <div class="hub-label">
            <h2>Список игр<br>на стрим</h2>
          </div>
        </button>
        <button type="button" class="hub-side right" id="go-archive" aria-label="Пройденные игры">
          <div class="bg-grad"></div>
          <img class="hub-figure" src="images/complete_mirror.png" alt="" decoding="async">
          <div class="hub-label">
            <h2>Пройденные<br>игры</h2>
          </div>
        </button>
      </div>
    </section>

    <section class="panel archive" id="panel-archive">
      <div class="bg-layer" id="bg-archive"></div>
      <div class="panel-glow" aria-hidden="true"></div>
      <button type="button" class="side-zone left" id="back-from-archive" aria-label="Назад">
        <span>Назад</span>
      </button>
      <div class="content has-side-left">
        <div class="content-inner">
          <div class="panel-head"><h1>Пройденные игры</h1></div>
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
            <input id="archive-search" type="search" placeholder="Поиск по названию…" aria-label="Поиск">
          </div>
          <div class="sort-bar" id="archive-sort">
            <span class="label">Сортировка:</span>
            <button type="button" class="sort-btn active" data-sort="chrono">По хронологии</button>
            <button type="button" class="sort-btn" data-sort="alpha">По алфавиту</button>
          </div>
          <div class="chips" id="archive-chips"></div>
          <div class="archive-list" id="archive-list"></div>
          <p class="foot" id="archive-foot"></p>
        </div>
      </div>
    </section>
  </div>
</div>

const K = 2;
const MEMES = [
  'images/arc4.png','images/atom6.png','images/baldur6.png','images/baldur8.png',
  'images/dav8.png','images/dd3.png','images/disco1.png','images/drgage5.png',
  'images/fnv11.png','images/hifm6.png','images/kotor5.png','images/nwn5.png',
  'images/tfallout9.png','images/wc8.png','images/witcher1.png','images/witcher2,33.png'
];

const track = document.getElementById('track');
let view = 'hub';

function setView(v) {
  view = v;
  const x = v === 'stream' ? '0%' : v === 'hub' ? '-33.3333%' : '-66.6666%';
  track.style.transform = 'translateX(' + x + ')';
}

document.getElementById('go-stream').addEventListener('click', () => setView('stream'));
document.getElementById('go-archive').addEventListener('click', () => setView('archive'));
document.getElementById('back-from-stream').addEventListener('click', () => setView('hub'));
document.getElementById('back-from-archive').addEventListener('click', () => setView('hub'));

let touchX = null;
const viewport = document.getElementById('viewport');
viewport.addEventListener('touchstart', (e) => { touchX = e.changedTouches[0].screenX; }, {passive:true});
viewport.addEventListener('touchend', (e) => {
  if (touchX == null) return;
  const dx = e.changedTouches[0].screenX - touchX;
  touchX = null;
  if (Math.abs(dx) < 50) return;
  if (view === 'hub') {
    if (dx > 0) setView('stream');
    else setView('archive');
  } else if (view === 'stream' && dx < 0) setView('hub');
  else if (view === 'archive' && dx > 0) setView('hub');
}, {passive:true});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') setView('hub');
  if (view === 'hub' && (e.key === 'ArrowLeft' || e.key === 'a')) setView('stream');
  if (view === 'hub' && (e.key === 'ArrowRight' || e.key === 'd')) setView('archive');
});

function rnd(a, b) { return a + Math.random() * (b - a); }

function fillBg(el, archive) {
  el.innerHTML = '';
  MEMES.forEach((src) => {
    const w = 300 + Math.round(Math.random() * 280);
    const h = Math.round(w * 9 / 16);
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    img.className = 'float-img' + (archive ? ' archive' : '');
    img.loading = 'lazy';
    const top = rnd(-15, 85);
    const left = rnd(-20, 85);
    const mk = () => ({
      x: rnd(-45, 45) + 'vw',
      y: rnd(-45, 45) + 'vh',
      r: rnd(-28, 28) + 'deg'
    });
    const p1 = mk(), p2 = mk(), p3 = mk(), p4 = mk();
    // 20% slower than before
    const dur = (16 + Math.random() * 18) * 1.25;
    const delay = -Math.random() * dur;
    img.style.cssText = [
      'width:' + w + 'px',
      'height:' + h + 'px',
      'top:' + top + '%',
      'left:' + left + '%',
      '--x1:' + p1.x, '--y1:' + p1.y, '--r1:' + p1.r,
      '--x2:' + p2.x, '--y2:' + p2.y, '--r2:' + p2.r,
      '--x3:' + p3.x, '--y3:' + p3.y, '--r3:' + p3.r,
      '--x4:' + p4.x, '--y4:' + p4.y, '--r4:' + p4.r,
      'animation-duration:' + dur + 's',
      'animation-delay:' + delay + 's'
    ].join(';');
    el.appendChild(img);
  });
}
fillBg(document.getElementById('bg-stream'), false);
fillBg(document.getElementById('bg-archive'), true);

function fmtChance(c) {
  if (c >= 1) return c.toFixed(2) + '%';
  if (c >= 0.1) return c.toFixed(3) + '%';
  return c.toFixed(4) + '%';
}
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

let ranked = [];
async function loadStream() {
  let lots = [];
  try {
    const res = await fetch('data.json?t=' + Date.now());
    if (res.ok) {
      const data = await res.json();
      lots = data.lots || data || [];
    }
  } catch (e) {}
  if (!lots.length) {
    lots = (EMBEDDED_STREAM && EMBEDDED_STREAM.lots) ? EMBEDDED_STREAM.lots : [];
  }
  const sorted = [...lots].sort((a,b) => (b.amount||0) - (a.amount||0) || String(a.name).localeCompare(String(b.name), 'ru'));
  const weights = sorted.map(g => Math.pow(Number(g.amount) || 0, K));
  const total = weights.reduce((s,w) => s+w, 0);
  ranked = sorted.map((g,i) => ({
    name: g.name,
    amount: Number(g.amount) || 0,
    chance: total > 0 ? weights[i] / total * 100 : 0,
    rank: i + 1
  }));
  renderStream();
}
function renderStream() {
  const q = document.getElementById('stream-search').value.trim().toLowerCase();
  const list = q ? ranked.filter(g => g.name.toLowerCase().includes(q)) : ranked;
  const body = document.getElementById('stream-body');
  if (!list.length) {
    body.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:2rem;color:var(--muted)">Ничего не найдено</td></tr>';
  } else {
    body.innerHTML = list.map(g => {
      const rc = g.rank <= 3 ? ' rank-' + g.rank : '';
      return '<tr><td><div class="game-cell"><span class="rank' + rc + '">' + g.rank + '</span><span>' + esc(g.name) +
        '</span></div></td><td class="pts">' + g.amount + '</td><td class="chance">' + fmtChance(g.chance) + '</td></tr>';
    }).join('');
  }
  document.getElementById('stream-foot').textContent = q
    ? 'Найдено: ' + list.length + ' из ' + ranked.length
    : 'Всего игр: ' + ranked.length;
}
document.getElementById('stream-search').addEventListener('input', renderStream);

let cats = [];
let activeCat = 'Все';
let archiveSort = 'chrono'; // chrono | alpha

function gameOrder(g) {
  const o = Number(g.order);
  return Number.isFinite(o) ? o : 99999;
}

async function loadArchive() {
  try {
    const res = await fetch('completed-games.json?t=' + Date.now());
    if (res.ok) cats = await res.json();
  } catch (e) {}
  if (!Array.isArray(cats) || !cats.length) cats = Array.isArray(EMBEDDED_COMPLETED) ? EMBEDDED_COMPLETED : [];
  const chips = document.getElementById('archive-chips');
  chips.innerHTML = ['Все'].concat(cats.map(c => c.category)).map(name =>
    '<button type="button" class="chip' + (name===activeCat?' active':'') + '" data-cat="' + esc(name) + '">' + esc(name) + '</button>'
  ).join('');
  chips.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCat = btn.getAttribute('data-cat');
      chips.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b.getAttribute('data-cat') === activeCat));
      renderArchive();
    });
  });
  document.querySelectorAll('#archive-sort .sort-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      archiveSort = btn.getAttribute('data-sort') || 'chrono';
      document.querySelectorAll('#archive-sort .sort-btn').forEach(b => b.classList.toggle('active', b === btn));
      renderArchive();
    });
  });
  renderArchive();
}
function renderArchive() {
  const q = document.getElementById('archive-search').value.trim().toLowerCase();
  const total = cats.reduce((s,c) => s + (c.games ? c.games.length : 0), 0);
  const sortFn = archiveSort === 'alpha'
    ? (a, b) => String(a.name).localeCompare(String(b.name), 'ru', { sensitivity: 'base' })
    : (a, b) => gameOrder(a) - gameOrder(b) || String(a.name).localeCompare(String(b.name), 'ru', { sensitivity: 'base' });

  if (archiveSort === 'chrono' && activeCat === 'Все' && !q) {
    // Flat chronological list across all genres
    const all = [];
    cats.forEach(c => (c.games || []).forEach(g => all.push({ ...g, category: c.category })));
    all.sort(sortFn);
    const el = document.getElementById('archive-list');
    el.innerHTML = '<article class="cat-block"><h2>Хронология<span>' + all.length + '</span></h2>' +
      all.map(g => {
        const meta = '<span style="color:var(--muted);font-size:0.85rem;margin-left:0.5rem">' + esc(g.category) + '</span>';
        return g.url
          ? '<a href="' + esc(g.url) + '" target="_blank" rel="noreferrer"><span>' + esc(g.name) + meta + '</span> <span style="color:var(--archive)">↗</span></a>'
          : '<div class="nolink"><span>' + esc(g.name) + meta + '</span></div>';
      }).join('') + '</article>';
    document.getElementById('archive-foot').textContent = 'Всего пройдено: ' + total;
    return;
  }

  const filtered = cats
    .filter(c => activeCat === 'Все' || c.category === activeCat)
    .map(c => ({
      category: c.category,
      games: (c.games || [])
        .filter(g => !q || String(g.name).toLowerCase().includes(q))
        .slice()
        .sort(sortFn)
    }))
    .filter(c => c.games.length);
  const shown = filtered.reduce((s,c) => s + c.games.length, 0);
  const el = document.getElementById('archive-list');
  if (!filtered.length) {
    el.innerHTML = '<p style="text-align:center;padding:2rem;color:var(--muted)">Ничего не найдено</p>';
  } else {
    el.innerHTML = filtered.map(c =>
      '<article class="cat-block"><h2>' + esc(c.category) + '<span>' + c.games.length + '</span></h2>' +
      c.games.map(g => g.url
        ? '<a href="' + esc(g.url) + '" target="_blank" rel="noreferrer">' + esc(g.name) + ' <span style="color:var(--archive)">↗</span></a>'
        : '<div class="nolink">' + esc(g.name) + '</div>'
      ).join('') + '</article>'
    ).join('');
  }
  document.getElementById('archive-foot').textContent =
    (q || activeCat !== 'Все') ? 'Найдено: ' + shown + ' из ' + total : 'Всего пройдено: ' + total;
}
document.getElementById('archive-search').addEventListener('input', renderArchive);

setView('hub');
loadStream();
loadArchive();
</script>
